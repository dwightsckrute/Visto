name: Publicar Visto

on:
  push:
    tags:
      - "visto-*"

permissions:
  contents: write

jobs:
  release:
    name: APK firmado y GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restaurar caché de Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Restaurar configuración privada
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$TMDB_API_KEY"
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > local.properties
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > visto-release.jks
          {
            printf 'storeFile=visto-release.jks\n'
            printf 'storePassword=%s\n' "$SIGNING_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$SIGNING_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$SIGNING_KEY_PASSWORD"
          } > keystore.properties

      - name: Verificar y compilar
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleRelease --build-cache --configuration-cache

      - name: Preparar descarga
        id: package
        run: |
          version="${GITHUB_REF_NAME#visto-}"
          apk="Visto-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "${apk}.sha256"
          printf 'apk=%s\n' "$apk" >> "$GITHUB_OUTPUT"

      - name: Publicar lanzamiento
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.package.outputs.apk }}
        run: |
          # Una etiqueta con "beta" sale marcada como prelanzamiento, así que no desplaza a la
          # versión estable en la portada del repositorio ni en "Latest".
          case "$GITHUB_REF_NAME" in
            *beta*) prerelease="--prerelease" ;;
            *)      prerelease="" ;;
          esac

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "${APK}.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "${APK}.sha256" \
              --title "Visto ${GITHUB_REF_NAME#visto-}" \
              --generate-notes $prerelease
          fi
